[package]
name = "sovereign-core"
version = "2.5.0"
edition = "2021"

[dependencies]
hex = { version = "0.4", default-features = false, features = ["alloc"] }
chacha20 = { version = "0.9", default-features = false }
reed-solomon-erasure = { version = "6.0", default-features = false }
sharks = { version = "0.5", default-features = false }
ed25519-dalek = { version = "2.0", default-features = false, features = ["alloc"] }
x25519-dalek = { version = "2.0", default-features = false, features = ["static_secrets"] }
pqc_kyber = { version = "0.7", default-features = false, features = ["kyber512"] }
rand_core = { version = "0.6", default-features = false }
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }
curve25519-dalek = { version = "4.0.0", default-features = false, features = ["alloc", "precomputed-tables"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true

[workspace]
