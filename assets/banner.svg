<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <radialGradient id="amb" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="400" fill="#030712"/>
  <rect width="1200" height="400" fill="url(#amb)"/>
  
  <!-- Circuit Grid Background -->
  <g stroke="#0ea5e9" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- Large Faded Icon Graphic on the Right -->
  <g transform="translate(820, 60) scale(11.5)" fill="none" stroke="#0ea5e9" stroke-opacity="0.12" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 17l6-6-6-6m8 14h8" />
  </g>

  <!-- Icon Box -->
  <g transform="translate(100, 120)">
    <rect width="160" height="160" rx="36" fill="#060d1a" stroke="#0ea5e9" stroke-width="2" stroke-opacity="0.4"/>
    <g transform="translate(40, 40) scale(3.33)" fill="none" stroke="url(#bgrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 17l6-6-6-6m8 14h8" />
    </g>
  </g>

  <!-- Title & Subtitle Typography -->
  <text x="300" y="195" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="56" font-weight="700" fill="#f8fafc" letter-spacing="-1">KellerOS</text>
  <text x="300" y="245" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="500" fill="#0ea5e9" letter-spacing="2">SOVEREIGN KERNEL &bull; KELLER SYSTEMS</text>

  <!-- Outer Frame -->
  <rect x="1" y="1" width="1198" height="398" rx="0" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.2"/>
</svg>